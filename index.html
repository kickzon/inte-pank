<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-kickzon</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  </head>
  <body>

    <h1>💸 Inte Pank 💸</h1>
    <p>- för dig som vill ha råd med mer än nudlar -</p>

    <div class="income-entry">
      <h2>Inkomster:</h2>
        <div class="field">
          <label for="incomeType">Typ av inkomst:</label>
          <select name="incomeType" id="incomeType" required>
            <option value="" disabled selected>Välj kategori</option>
          </select>
        </div>

        <div class="field">
          <label for="income">Belopp:</label>
          <input type="number" id="income" placeholder="Belopp"/>
        </div>

        <div class="field">
          <label for="description">Beskrivning:</label>
          <input type="text" name="incomeDescription" id="incomeDescription" placeholder="Beskrivning"/>
        </div>
      <button id="addIncomeBtn">Lägg till</button>
    </div>

    <div class="expenses-entry">
      <h2>Utgifter:</h2>
        <div class="field">
          <label for="expenseType">Typ av utgift:</label>
          <select name="expenseType" id="expenseType" required>
            <option value="" disabled selected>Välj kategori</option>
          </select>
        </div>

        <div class="field">
          <label for="expenses">Belopp:</label>
          <input type="number" id="expenses" placeholder="Belopp" />
        </div>

        <div class="field">
          <label for="description">Beskrivning:</label>
          <input type="text" name="description" id="description" placeholder="Beskrivning" />
        </div>
      <button id="addExpensesBtn">Lägg till</button>
    </div>

    <section>
      <h2>Inkomster och utgifter</h2>
    <div id="data"></div>
    </section>

    <section>
      <h2>Balans</h2>
      <h3 id="balance">Totalt: 0 kr</h3>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
